# This workflow will upload a Python Package using PyPI trusted publishing when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish packages

on:
  release:
    types: [published]
  # Build and check, but never publish, when packaging changes, so a broken
  # release pipeline is caught in review rather than at release time.
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'pyproject.toml'
  # Runner images and setuptools releases change out from under the workflow
  # with no change to this repo, so build and check weekly as well.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish PyPI packages on success?"
        required: true
        type: boolean
        default: true
#     publish_anaconda:
#       description: "Publish Anaconda packages on success?"
#       required: true
#       type: boolean
#       default: true
      build_number:
        description: "Package build number"
        required: true
        type: string
        default: 0

jobs:
  # Kept apart from publish so that nothing installed or run during the build
  # executes in a job that can mint a PyPI token.
  build:

    runs-on: ubuntu-24.04

    permissions:
      contents: read

#   services:
#     singlestore:
#       image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
#       ports:
#         - 3307:3306
#         - 8081:8080
#         - 9080:9000
#       env:
#         SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
#         ROOT_PASSWORD: "root"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build PyPI package
        run: |
          python -m build

      - name: Check package metadata
        run: |
          twine check --strict dist/*

      # Install the wheel into a clean environment, away from the checkout, so
      # the check exercises the packaged files and entry points rather than
      # the source tree.
      - name: Check the wheel installs and registers the dialect
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-check
          wheel-check/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-check/bin/python -c "
          import sqlalchemy as sa
          import sqlalchemy_singlestoredb as s2
          engine = sa.create_engine('singlestoredb://user:pw@localhost/db')
          assert isinstance(engine.dialect, s2.dialect), type(engine.dialect)
          print(type(engine.dialect))
          "

#     - name: Build Conda package
#       run: |
#         # $CONDA is an environment variable pointing to the root of the miniconda directory
#         echo $CONDA/bin >> $GITHUB_PATH
#         conda update conda
#         conda install conda-build anaconda-client conda-verify
#         mkdir artifacts
#         cd conda.recipe
#         conda build --override-channels -c singlestore -c conda-forge --no-anaconda-upload --output-folder ../artifacts .
#       env:
#         SINGLESTOREDB_URL: "root:root@127.0.0.1:3307"

      - name: Archive source dist and wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 2

  publish:
    needs: build
    # Runs on manual dispatch even with publish_pypi off, so the environment,
    # artifact handoff and job setup can be exercised without uploading; only
    # the PyPI step is gated on publishing.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}

    runs-on: ubuntu-24.04

    permissions:
      id-token: write   # Required for OIDC trusted publishing
      actions: read     # Required for actions/download-artifact

    environment:
      name: publish
      url: https://pypi.org/p/sqlalchemy-singlestoredb

    steps:
      - name: Download source dist and wheel
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish PyPI package
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1


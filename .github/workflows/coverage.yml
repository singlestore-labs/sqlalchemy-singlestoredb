name: Coverage tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    environment: Base

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # One version, not a matrix: the supported range is covered by
      # smoke-test.yml and pre-commit.yml, so this uses the newest
      # well-supported release -- one behind the top of the smoke-test matrix,
      # so dependencies have caught up -- rather than the floor in
      # pyproject.toml. Release PRs get the
      # smoke-test matrix from smoke-test.yml's own pull_request trigger.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install SingleStore package and SQLAlchemy 2.0.x
        run: |
          pip install 'sqlalchemy~=2.0.0'
          pip install .

      - name: Run MySQL protocol tests
        run: |
          pytest -v --cov=sqlalchemy_singlestoredb --pyargs sqlalchemy_singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-mysql-2-0.cov"

      - name: Run HTTP protocol tests
        run: |
          pytest -v --cov=sqlalchemy_singlestoredb --pyargs sqlalchemy_singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-http.cov"
          USE_DATA_API: "1"

      - name: Install SingleStore package and SQLAlchemy 1.4.x
        run: |
          pip install 'sqlalchemy~=1.4.0'

      - name: Run MySQL protocol tests
        run: |
          pytest -v --cov=sqlalchemy_singlestoredb --pyargs sqlalchemy_singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-mysql-1-4.cov"

      - name: Generate report
        run: |
          coverage combine coverage-mysql-2-0.cov coverage-mysql-1-4.cov
          coverage report
          coverage xml
          coverage html
